<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아이콘 업로드 UI 검증</title>
  <style>
    body {
      margin: 32px auto;
      padding: 0 16px;
      max-width: 1000px;
      font: 14px sans-serif;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      font: inherit;
    }
    iframe {
      width: 100%;
      height: 180px;
      border: 1px solid #ccc;
      margin-top: 12px;
    }
  </style>
  <p id="result" role="status">검증 중…</p>
  <input name="subject" aria-label="제목" value="냥냥콘" />
  <input name="subject_limit" type="hidden" value="45" />
  <div class="board_main_view">
    <div class="toolbar"><img alt="툴바 아이콘" /></div>
    <textarea name="content" hidden>&lt;img&gt;</textarea>
    <iframe title="본문 편집기" srcdoc="<body contenteditable='true'></body>"></iframe>
  </div>
  <script type="module" src="./icon-upload.ts"></script>
</html>
